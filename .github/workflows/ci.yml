name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Build
        run: dub build --build=release

      - name: Help smoke test
        run: |
          set +e
          ./dub-publish
          rc=$?
          set -e
          test "$rc" -eq 2
          ./dub-publish "?"
