name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Build
        run: dub build --build=release

      - name: Help smoke test
        run: ./dub-publish help
